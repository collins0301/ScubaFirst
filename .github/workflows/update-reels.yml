name: Update top Instagram reels

on:
  schedule:
    - cron: "17 12 * * *"   # daily, about 6:17 am Utah time
  workflow_dispatch: {}     # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick most-viewed reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/update-reels.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/reels.json; then echo "No change"; exit 0; fi
          git config user.name "scuba-first-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reels.json
          git commit -m "Update top Instagram reels"
          git push
