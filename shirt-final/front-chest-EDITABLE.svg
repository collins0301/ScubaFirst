  <text class="s" x="200" y="128" font-size="62" fill="#EFE6D2" text-anchor="middle" letter-spacing="2">JACKSON</text>
  <text class="s" x="200" y="180" font-size="40" fill="#EFE6D2" text-anchor="middle" letter-spacing="2">DIVE FAMILY</text>
