<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 300" width="4in" height="3in">
<style>.s{font-family:Cinzel;font-weight:700}</style>
<g id="text" inkscape:groupmode="layer" inkscape:label="Text">
